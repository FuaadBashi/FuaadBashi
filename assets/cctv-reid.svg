<svg xmlns="http://www.w3.org/2000/svg" width="480" height="226" viewBox="0 0 480 226" role="img" aria-label="CCTV Re-Identification (Python): Tracks people through CCTV footage and keeps the same ID when someone is hidden and comes back. Every ID decision is logged with a reason. YOLOv8 → DeepSORT → face/body embeddings.">
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#ffa657"/><stop offset="1" stop-color="#ffa657" stop-opacity="0"/></linearGradient>
<clipPath id="r"><rect width="480" height="226" rx="14"/></clipPath></defs>
<g clip-path="url(#r)">
<rect x=".5" y=".5" width="479" height="225" rx="14" fill="#0d1117" stroke="#30363d"/>
<rect width="480" height="3" fill="url(#g)"/>
</g>
<text x="28" y="48" fill="#e6edf3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="700">CCTV Re-Identification</text>
<text x="452" y="47" text-anchor="end" fill="#ffa657" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13">Python</text>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><text x="28" y="82" fill="#9da7b3" font-size="15.5">Tracks people through CCTV footage and keeps</text><text x="28" y="105" fill="#9da7b3" font-size="15.5">the same ID when someone is hidden and comes</text><text x="28" y="128" fill="#9da7b3" font-size="15.5">back. Every ID decision is logged with a reason.</text></g>
<text x="28" y="162" fill="#ffa657" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700">▸ YOLOv8 → DeepSORT → face/body embeddings</text>
<rect x="28" y="180" width="73" height="24" rx="12" fill="#ffa657" fill-opacity=".12" stroke="#ffa657" stroke-opacity=".45"/><text x="65" y="196.5" text-anchor="middle" fill="#ffa657" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12">PyTorch</text><rect x="109" y="180" width="66" height="24" rx="12" fill="#ffa657" fill-opacity=".12" stroke="#ffa657" stroke-opacity=".45"/><text x="142" y="196.5" text-anchor="middle" fill="#ffa657" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12">YOLOv8</text><rect x="183" y="180" width="80" height="24" rx="12" fill="#ffa657" fill-opacity=".12" stroke="#ffa657" stroke-opacity=".45"/><text x="223" y="196.5" text-anchor="middle" fill="#ffa657" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12">DeepSORT</text><rect x="271" y="180" width="102" height="24" rx="12" fill="#ffa657" fill-opacity=".12" stroke="#ffa657" stroke-opacity=".45"/><text x="322" y="196.5" text-anchor="middle" fill="#ffa657" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12">InsightFace</text>
</svg>
